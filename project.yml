name: MobileIDE
options:
  bundleIdPrefix: com.d0ne1s
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_LANGUAGE: ja
    ENABLE_USER_SCRIPT_SANDBOXING: NO

schemes:
  MobileIDE:
    build:
      targets:
        MobileIDE: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  MobileIDE:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MobileIDE
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.d0ne1s.mobileide
        PRODUCT_NAME: MobileIDE
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"  # iPhone のみ
        # 実機は Vid と同じく Team VYDUR99LAM の自動署名（iOS Team Provisioning Profile: * が有効）。
        # 別 Mac で署名に失敗する場合は xcodebuild に -allowProvisioningUpdates を付ける（mise の device-* タスクは付けてある）
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: VYDUR99LAM
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: "Mobile IDE"
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: YES
