[tools]
xcodegen = "2.45.4"

[env]
DEVELOPER_DIR = "/Applications/Xcode.app/Contents/Developer"

[tasks.icon]
description = "アプリアイコン（light / dark の 1024px）を scripts/generate-app-icon.swift で生成"
run = "bash scripts/generate-app-icon.sh"

[tasks.gen]
description = "project.yml から Xcode プロジェクトを再生成"
run = "xcodegen generate"

# SwiftTerm がビルドツールプラグインを使うので、全 xcodebuild に -skipPackagePluginValidation を付ける（無いと plugin validation で止まる）。
# シミュレータは -sdk iphonesimulator だとプラグインのホストツール（SwiftTermBuildInfoGenerator）が組まれず
# 「Build input file cannot be found」になるので -destination 'generic/platform=iOS Simulator' を使う
[tasks.build]
description = "iOS Simulator 向けにビルド（-destination 'generic/platform=iOS Simulator' で simulator runtime の版ズレを回避）"
run = "xcodebuild -skipPackagePluginValidation -project MobileIDE.xcodeproj -scheme MobileIDE -destination 'generic/platform=iOS Simulator' -configuration Debug build"

[tasks.boot]
description = "iPhone 17 シミュレータを起動"
run = """
xcrun simctl boot "${MOBILE_IDE_SIMULATOR_DEVICE:-iPhone 17}" 2>/dev/null || true
open -a Simulator
"""

[tasks.install]
description = "起動中のシミュレータにアプリをインストール（build 済み前提。depends は並列実行なので直列に繋ぐ）"
depends = ["build"]
run = """
APP_PATH=$(xcodebuild -skipPackagePluginValidation -project MobileIDE.xcodeproj -scheme MobileIDE -destination 'generic/platform=iOS Simulator' -configuration Debug -showBuildSettings 2>/dev/null | awk -F' = ' '/ BUILT_PRODUCTS_DIR /{print $2; exit}')
xcrun simctl install booted "$APP_PATH/MobileIDE.app"
"""

[tasks.run]
description = "ビルド → インストール → 起動（シミュレータが起動済み前提）"
depends = ["install"]
run = "xcrun simctl launch booted com.d0ne1s.mobileide"

[tasks.shot]
description = "起動中シミュレータのスクリーンショットを /tmp/mobile-ide.png に保存"
run = "xcrun simctl io booted screenshot /tmp/mobile-ide.png"

# --- 実機 -------------------------------------------------------------------
# iPhone を USB で接続して「信頼」した状態で使う。MOBILE_IDE_DEVICE で識別子を固定できる
# （既定は scripts/device-id.sh がペアリング済みの iPhone を 1 台選ぶ）。

[tasks.device-build]
description = "接続中の iPhone 向けにビルド（自動署名。provisioning が無ければ作る）"
run = """
set -e
DEVICE=$(bash scripts/device-id.sh)
xcodebuild -skipPackagePluginValidation -project MobileIDE.xcodeproj -scheme MobileIDE -destination "id=$DEVICE" -configuration Debug -allowProvisioningUpdates build
"""

[tasks.device-install]
description = "接続中の iPhone にアプリをインストールして起動（device-build に依存。depends は並列実行なので直列に繋ぐ）"
depends = ["device-build"]
run = """
set -e
DEVICE=$(bash scripts/device-id.sh)
APP_PATH=$(xcodebuild -skipPackagePluginValidation -project MobileIDE.xcodeproj -scheme MobileIDE -destination "id=$DEVICE" -configuration Debug -showBuildSettings 2>/dev/null | awk -F' = ' '/ BUILT_PRODUCTS_DIR /{print $2; exit}')
xcrun devicectl device install app --device "$DEVICE" "$APP_PATH/MobileIDE.app"
xcrun devicectl device process launch --device "$DEVICE" --terminate-existing com.d0ne1s.mobileide
"""

[tasks.device-run]
description = "実機向けにビルド → インストール → 起動"
depends = ["device-install"]
